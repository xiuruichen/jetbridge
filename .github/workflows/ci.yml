name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --junitxml=results.xml
      - name: Show failed tests without needing to sign in
        if: failure()
        run: uv run python tools/ci_failures.py results.xml

  # What can be learned about a Mac without airline sites or a person. It never contacts an airline.
  mac-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try the installer
        env:
          JETBRIDGE_INSTALL_NO_START: "1"
          JETBRIDGE_REPO: ${{ github.workspace }}
          JETBRIDGE_BRANCH: ${{ github.ref_name }}
          JETBRIDGE_DIR: ${{ runner.temp }}/jetbridge
        run: bash install.sh
      - name: Try the background task, keep-awake and Chrome
        env:
          JETBRIDGE_HOME: ${{ runner.temp }}/jetbridge-state
        run: |
          mkdir -p "$JETBRIDGE_HOME"
          "$RUNNER_TEMP/jetbridge/.venv/bin/python" tools/mac_smoke.py
      - name: Check the command works
        run: ~/.local/bin/jetbridge --version
