<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">A jetbridge similar-flight alert</title>
  <desc id="desc">An example urgent alert saying a similar flight opened: CX805 from EWR to Hong Kong in business at 80,000 miles, one airport over from the watched route. The booking link comes first, then why it counts, how fast past openings closed, and that a second live check confirmed it.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13.5px; fill: #ededee; }
    .l { fill: #6b6b73; }
    .s { font-size: 12.5px; fill: #86868e; }
  </style>
  <rect x="0.5" y="0.5" width="639" height="499" rx="16" fill="#0a0a0b" stroke="#1d1d20"/>

  <circle cx="44" cy="48" r="3.5" fill="#3ddc97"/>
  <text x="56" y="52" class="mono" font-size="11" letter-spacing="1.4" fill="#3ddc97">URGENT · SIMILAR FLIGHT</text>
  <text x="36" y="86" class="sans" font-size="18" font-weight="600" fill="#f4f4f5" letter-spacing="-0.3">SIMILAR FLIGHT OPEN: CX805 EWR-HKG business - 80,000 mi</text>
  <text x="36" y="108" class="sans s">From your own Gmail · just now · also sent to your phone</text>
  <line x1="36" y1="126" x2="604" y2="126" stroke="#1d1d20"/>

  <rect x="36" y="144" width="172" height="38" rx="8" fill="#ededee"/>
  <text x="122" y="168" class="sans" font-size="14" font-weight="600" fill="#0a0a0b" text-anchor="middle">Check and book  →</text>
  <text x="224" y="168" class="sans s">link comes first</text>

  <text x="36" y="224" class="mono" xml:space="preserve"><tspan class="l">You're watching </tspan>CX805 JFK-HKG business</text>
  <text x="36" y="248" class="mono" xml:space="preserve"><tspan class="l">This one is      </tspan><tspan fill="#3ddc97">from EWR instead of JFK</tspan></text>
  <text x="36" y="272" class="mono" xml:space="preserve"><tspan class="l">Date             </tspan>May 21, 2027</text>
  <text x="36" y="296" class="mono" xml:space="preserve"><tspan class="l">Price            </tspan>80,000 miles per person</text>
  <text x="36" y="320" class="mono" xml:space="preserve"><tspan class="l">Your limit       </tspan>90,000 miles</text>

  <rect x="36" y="344" width="568" height="58" rx="8" fill="#101012" stroke="#1f1f23"/>
  <text x="52" y="368" class="sans s" fill="#b4b4bb">History: the 2 past openings on this date were gone within</text>
  <text x="52" y="388" class="sans s" fill="#b4b4bb">3 hours to 8 hours. Decide soon.</text>

  <circle cx="43" cy="432" r="3" fill="#3ddc97"/>
  <text x="56" y="436" class="sans s" fill="#b4b4bb">Observed 09:42 AM, and confirmed by a second live check.</text>
  <text x="36" y="466" class="sans s" font-size="11.5" fill="#52525a">Award seats can vanish quickly. Confirm on the site before moving any points.</text>
  <text x="604" y="466" class="sans s" font-size="11.5" fill="#52525a" text-anchor="end">Made-up flight and price.</text>
</svg>
