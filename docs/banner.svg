<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">jetbridge</title>
  <desc id="desc">Award seats vanish at 3 AM. jetbridge is awake. It watches your flight, its sibling flights, nearby dates and nearby airports, and confirms seats live before it alerts you.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d15"/>
      <stop offset="1" stop-color="#0f1a30"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ff0c0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ff0c0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#4ff0c0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4ff0c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2.4px; fill: #8b97ad; }
    .big { font-size: 46px; font-weight: 800; fill: #f2f5fb; letter-spacing: -1.4px; }
    .sub { font-size: 17px; fill: #9aa6bd; }
    .chip { font-size: 13px; font-weight: 600; fill: #cfd8ea; }
    .node { font-size: 12px; font-weight: 600; fill: #8b97ad; }
    .hub { font-size: 14px; font-weight: 700; fill: #f2f5fb; }
    .tag { font-size: 12px; font-weight: 600; fill: #4ff0c0; }
  </style>

  <rect width="1000" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="340" rx="18" fill="url(#glowA)"/>
  <rect width="1000" height="340" rx="18" fill="url(#glowB)"/>

  <!-- routes converging on one destination -->
  <g fill="none" stroke-linecap="round">
    <path d="M652 78 Q 760 70 900 170" stroke="#5b8cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 7"/>
    <path d="M690 112 Q 790 96 900 170" stroke="#5b8cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 7"/>
    <path d="M700 292 Q 800 250 900 170" stroke="#5b8cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 7"/>
    <path d="M690 42 Q 800 40 900 170" stroke="#5b8cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 7"/>
    <!-- the one that just opened -->
    <path d="M666 226 Q 780 196 900 170" stroke="#4ff0c0" stroke-opacity="0.55" stroke-width="6" filter="url(#soft)"/>
    <path d="M666 226 Q 780 196 900 170" stroke="#4ff0c0" stroke-width="2.2"/>
  </g>

  <g class="sans">
    <circle cx="652" cy="78" r="5" fill="#0f1a30" stroke="#5b8cff" stroke-width="2"/>
    <text x="664" y="70" class="node">YYZ</text>
    <circle cx="690" cy="112" r="5" fill="#0f1a30" stroke="#5b8cff" stroke-width="2"/>
    <text x="702" y="104" class="node">ORD</text>
    <circle cx="690" cy="42" r="5" fill="#0f1a30" stroke="#5b8cff" stroke-width="2"/>
    <text x="702" y="34" class="node">BOS</text>
    <circle cx="700" cy="292" r="5" fill="#0f1a30" stroke="#5b8cff" stroke-width="2"/>
    <text x="712" y="298" class="node">JFK</text>
    <circle cx="666" cy="226" r="7" fill="#4ff0c0"/>
    <circle cx="666" cy="226" r="14" fill="none" stroke="#4ff0c0" stroke-opacity="0.5" stroke-width="2">
      <animate attributeName="r" values="9;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="640" y="256" class="hub">EWR</text>

    <circle cx="900" cy="170" r="9" fill="url(#mark)"/>
    <circle cx="900" cy="170" r="18" fill="none" stroke="#5b8cff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="900" y="206" class="hub" text-anchor="middle">HKG</text>

    <rect x="728" y="226" width="152" height="46" rx="10" fill="#0b1220" stroke="#4ff0c0" stroke-opacity="0.55"/>
    <text x="743" y="246" class="tag">SIMILAR FLIGHT OPEN</text>
    <text x="743" y="263" class="mono" font-size="12" fill="#e8edf7">EWR→HKG  80,000 mi</text>
  </g>

  <!-- brand -->
  <g transform="translate(48 44)">
    <rect width="44" height="44" rx="11" fill="url(#mark)"/>
    <path d="M8 31 L24 20 L24 31 Z" fill="#0b1220" fill-opacity="0.85"/>
    <rect x="24" y="11" width="12" height="20" rx="3" fill="#0b1220"/>
    <circle cx="33" cy="22" r="1.5" fill="#4ff0c0"/>
  </g>
  <text x="106" y="73" class="sans" font-size="26" font-weight="800" fill="#f2f5fb" letter-spacing="-0.6">jetbridge</text>
  <text x="48" y="128" class="sans eyebrow">AWARD SEAT ALERTS · AMERICAN · DELTA · UNITED</text>

  <text x="48" y="182" class="sans big">Award seats vanish at 3 AM.</text>
  <text x="48" y="234" class="sans big" fill="url(#ink)">jetbridge is awake.</text>
  <text x="48" y="266" class="sans sub">Live re-check before every alert. Free. Runs on your own computer.</text>

  <g class="sans">
    <rect x="48" y="288" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="112" y="308" class="chip" text-anchor="middle">Similar flights</text>
    <rect x="186" y="288" width="144" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="258" y="308" class="chip" text-anchor="middle">Nearby airports</text>
    <rect x="340" y="288" width="124" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="402" y="308" class="chip" text-anchor="middle">Nearby dates</text>
    <rect x="474" y="288" width="134" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="541" y="308" class="chip" text-anchor="middle">Chat with Claude</text>
  </g>
</svg>
