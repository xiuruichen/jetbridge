<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">jetbridge</title>
  <desc id="desc">Award seats vanish at 3 AM. jetbridge is awake. Award seat alerts for American, Delta and United, re-checked live before they reach you. A route map shows an alert for a similar flight, EWR to HKG at 80,000 miles, confirmed live.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .word { font-size: 17px; font-weight: 600; fill: #ededee; letter-spacing: -0.3px; }
    .big { font-size: 46px; font-weight: 600; letter-spacing: -1.7px; }
    .sub { font-size: 15px; fill: #86868e; }
    .tick { font-size: 11px; fill: #6b6b73; letter-spacing: 0.4px; }
    .node { font-size: 11px; fill: #6b6b73; }
    .hub { font-size: 12px; font-weight: 600; fill: #ededee; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="329" rx="16" fill="#0a0a0b" stroke="#1d1d20"/>

  <!-- brand -->
  <g transform="translate(48 42)">
    <rect width="26" height="26" rx="7" fill="#ededee"/>
    <path d="M5 19 L14 12.5 L14 19 Z" fill="#0a0a0b"/>
    <rect x="14" y="7" width="7" height="12" rx="2" fill="#0a0a0b"/>
  </g>
  <text x="86" y="61" class="sans word">jetbridge</text>

  <!-- headline -->
  <text x="48" y="156" class="sans big" fill="#f4f4f5">Award seats vanish at 3 AM.</text>
  <text x="48" y="210" class="sans big" fill="#6b6b73">jetbridge is awake.</text>
  <text x="48" y="248" class="sans sub">Award seat alerts for American, Delta and United,</text>
  <text x="48" y="270" class="sans sub">re-checked live before they reach you. Free, and local.</text>

  <g class="mono tick">
    <circle cx="52" cy="298" r="2.5" fill="#3ddc97"/>
    <text x="62" y="302">similar flights</text>
    <circle cx="180" cy="298" r="2.5" fill="#3ddc97"/>
    <text x="190" y="302">nearby airports</text>
    <circle cx="316" cy="298" r="2.5" fill="#3ddc97"/>
    <text x="326" y="302">nearby dates</text>
  </g>

  <!-- routes converging on one destination -->
  <g fill="none" stroke-linecap="round">
    <path d="M650 64 Q 790 82 920 170" stroke="#2a2a2f"/>
    <path d="M650 114 Q 790 120 920 170" stroke="#2a2a2f"/>
    <path d="M650 164 Q 790 168 920 170" stroke="#2a2a2f"/>
    <path d="M650 214 Q 790 196 920 170" stroke="#2a2a2f"/>
    <path id="hit" d="M650 264 Q 790 226 920 170" stroke="#3ddc97" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="650" cy="64" r="3" fill="#0a0a0b" stroke="#52525a"/>
    <circle cx="650" cy="114" r="3" fill="#0a0a0b" stroke="#52525a"/>
    <circle cx="650" cy="164" r="3" fill="#0a0a0b" stroke="#52525a"/>
    <circle cx="650" cy="214" r="3" fill="#0a0a0b" stroke="#52525a"/>
    <circle cx="650" cy="264" r="3.5" fill="#3ddc97"/>
    <circle cx="920" cy="170" r="4.5" fill="#ededee"/>
    <circle r="2.6" fill="#3ddc97">
      <animateMotion dur="4s" repeatCount="indefinite" path="M650 264 Q 790 226 920 170"/>
    </circle>
  </g>
  <g class="mono">
    <text x="638" y="68" class="node" text-anchor="end">BOS</text>
    <text x="638" y="118" class="node" text-anchor="end">YYZ</text>
    <text x="638" y="168" class="node" text-anchor="end">ORD</text>
    <text x="638" y="218" class="node" text-anchor="end">LAX</text>
    <text x="638" y="268" class="hub" text-anchor="end">EWR</text>
    <text x="920" y="196" class="hub" text-anchor="middle">HKG</text>
  </g>
  <rect x="716" y="252" width="228" height="48" rx="8" fill="#101012" stroke="#26262b"/>
  <circle cx="732" cy="270" r="3" fill="#3ddc97"/>
  <text x="744" y="274" class="mono" font-size="11.5" font-weight="600" fill="#ededee">EWR → HKG · 80,000 mi</text>
  <text x="732" y="290" class="mono" font-size="10.5" fill="#6b6b73">similar flight · confirmed live</text>
</svg>
