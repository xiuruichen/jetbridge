<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
  <title id="title">The board jetbridge draws in a Claude Desktop chat</title>
  <desc id="desc">An example watch on any nonstop from Seattle to Seoul, showing proof of watching, one date with seats open, a near miss above a price limit, a past opening, and a date it couldn't read.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .h { font-size: 19px; font-weight: 600; fill: #f4f4f5; letter-spacing: -0.4px; }
    .t { font-size: 14.5px; fill: #ededee; }
    .s { font-size: 12.5px; fill: #86868e; }
    .d { font-size: 11px; letter-spacing: 1.2px; fill: #6b6b73; }
    .st { font-size: 10.5px; letter-spacing: 1.2px; font-weight: 600; }
  </style>
  <rect x="0.5" y="0.5" width="639" height="469" rx="16" fill="#0a0a0b" stroke="#1d1d20"/>

  <text x="36" y="54" class="sans h">Any nonstop · SEA → ICN</text>
  <text x="36" y="76" class="sans s">business · Delta SkyMiles · 2 passengers</text>
  <text x="604" y="54" class="sans s" text-anchor="end">Next check today, 4:15 PM</text>
  <circle cx="40" cy="97" r="3" fill="#3ddc97"/>
  <text x="52" y="101" class="mono" font-size="11.5" fill="#86868e">watched 24 of the last 24 hours · longest gap 5.2 h</text>

  <line x1="36" y1="122" x2="604" y2="122" stroke="#1d1d20"/>

  <text x="36" y="152" class="mono d">FRI MAY 21</text>
  <circle cx="156" cy="148" r="3.5" fill="#3ddc97"/>
  <text x="170" y="152" class="mono st" fill="#3ddc97">OPEN</text>
  <text x="232" y="152" class="sans t" font-weight="600">DL197 · 95,000 miles</text>
  <rect x="232" y="166" width="140" height="30" rx="7" fill="#ededee"/>
  <text x="302" y="185" class="sans" font-size="12.5" font-weight="600" fill="#0a0a0b" text-anchor="middle">Check and book  →</text>

  <line x1="36" y1="214" x2="604" y2="214" stroke="#1d1d20"/>
  <text x="36" y="244" class="mono d">SAT MAY 22</text>
  <circle cx="156" cy="240" r="3.5" fill="#e0a43c"/>
  <text x="170" y="244" class="mono st" fill="#e0a43c">NEAR</text>
  <text x="232" y="244" class="sans t">No seats · <tspan fill="#e0a43c">140,000 miles, above your limit</tspan></text>

  <line x1="36" y1="264" x2="604" y2="264" stroke="#1d1d20"/>
  <text x="36" y="294" class="mono d">SUN MAY 23</text>
  <circle cx="156" cy="290" r="3.5" fill="none" stroke="#6b6b73"/>
  <text x="170" y="294" class="mono st" fill="#6b6b73">CLOSED</text>
  <text x="232" y="294" class="sans t">No seats</text>
  <text x="232" y="316" class="sans s">Seen 3 days ago: open for between 2 and 6 hours, 95,000 miles</text>

  <line x1="36" y1="336" x2="604" y2="336" stroke="#1d1d20"/>
  <text x="36" y="366" class="mono d">MON MAY 24</text>
  <circle cx="156" cy="362" r="3.5" fill="#6b6b73"/>
  <text x="170" y="366" class="mono st" fill="#6b6b73">UNSURE</text>
  <text x="232" y="366" class="sans t">Couldn't tell at the last check</text>
  <text x="232" y="388" class="sans s">That never counts as no seats.</text>

  <line x1="36" y1="412" x2="604" y2="412" stroke="#1d1d20"/>
  <text x="36" y="438" class="sans s" font-size="11.5" fill="#52525a">jetbridge never logs in, books anything or moves your miles.</text>
  <text x="604" y="438" class="sans s" font-size="11.5" fill="#52525a" text-anchor="end">Made-up flights and prices.</text>
</svg>
