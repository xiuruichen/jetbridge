<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title desc">
  <title id="title">The board jetbridge draws in a Claude Desktop chat</title>
  <desc id="desc">An example watch on any nonstop from Seattle to Seoul, showing proof of watching, one date with seats open, a near miss above a price limit, a past opening, and a date it couldn't read.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 20px; font-weight: 700; fill: #f2f5fb; }
    .t { font-size: 15px; fill: #e8edf7; }
    .s { font-size: 13px; fill: #8b97ad; }
    .d { font-size: 13px; font-weight: 600; fill: #8b97ad; }
    .g { font-weight: 700; fill: #4ff0c0; }
    .n { fill: #ffb454; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
  </style>
  <rect width="640" height="490" rx="16" fill="#090d15"/>
  <rect x="14" y="14" width="612" height="430" rx="12" fill="#101626" stroke="#232c3f"/>

  <text x="36" y="50" class="sans h">Any nonstop · SEA → ICN</text>
  <text x="36" y="72" class="sans s">business · Delta SkyMiles · 2 passengers</text>
  <rect x="36" y="84" width="326" height="24" rx="12" fill="#4ff0c0" fill-opacity="0.1" stroke="#4ff0c0" stroke-opacity="0.35"/>
  <circle cx="50" cy="96" r="4" fill="#4ff0c0"/>
  <text x="62" y="100" class="sans s" fill="#bdf7e6">Watched 24 of the last 24 hours · longest gap 5.2 h</text>
  <text x="604" y="50" class="sans s" text-anchor="end">Next check today, 4:15 PM</text>

  <line x1="36" y1="126" x2="604" y2="126" stroke="#232c3f"/>

  <text x="36" y="154" class="sans d">FRI MAY 21</text>
  <rect x="140" y="138" width="68" height="22" rx="11" fill="#4ff0c0" fill-opacity="0.14"/>
  <text x="174" y="153" class="sans pill" fill="#4ff0c0" text-anchor="middle">OPEN</text>
  <text x="222" y="154" class="sans t"><tspan class="g">DL197 · 95,000 miles</tspan></text>
  <rect x="222" y="168" width="132" height="30" rx="15" fill="#4ff0c0"/>
  <text x="288" y="188" class="sans" font-size="13" font-weight="700" fill="#07101f" text-anchor="middle">Check and book →</text>

  <line x1="36" y1="216" x2="604" y2="216" stroke="#232c3f"/>
  <text x="36" y="244" class="sans d">SAT MAY 22</text>
  <rect x="140" y="228" width="68" height="22" rx="11" fill="#ffb454" fill-opacity="0.14"/>
  <text x="174" y="243" class="sans pill" fill="#ffb454" text-anchor="middle">NEAR</text>
  <text x="222" y="244" class="sans t">No seats · <tspan class="n">140,000 miles, above your limit</tspan></text>

  <line x1="36" y1="266" x2="604" y2="266" stroke="#232c3f"/>
  <text x="36" y="294" class="sans d">SUN MAY 23</text>
  <rect x="140" y="278" width="68" height="22" rx="11" fill="#8b97ad" fill-opacity="0.14"/>
  <text x="174" y="293" class="sans pill" fill="#8b97ad" text-anchor="middle">CLOSED</text>
  <text x="222" y="294" class="sans t">No seats</text>
  <text x="222" y="316" class="sans s">Seen 3 days ago: open for between 2 and 6 hours, 95,000 miles</text>

  <line x1="36" y1="336" x2="604" y2="336" stroke="#232c3f"/>
  <text x="36" y="364" class="sans d">TUE MAY 25</text>
  <rect x="140" y="348" width="68" height="22" rx="11" fill="#8b97ad" fill-opacity="0.14"/>
  <text x="174" y="363" class="sans pill" fill="#8b97ad" text-anchor="middle">UNSURE</text>
  <text x="222" y="364" class="sans t">Couldn't tell at the last check</text>
  <text x="222" y="386" class="sans s">That never counts as no seats.</text>

  <text x="320" y="424" class="sans s" text-anchor="middle" font-size="12">An illustration with made-up flights and prices.</text>
  <text x="320" y="470" class="sans s" text-anchor="middle" font-size="12" fill="#5d6a82">jetbridge never logs in, books anything or moves your miles.</text>
</svg>
