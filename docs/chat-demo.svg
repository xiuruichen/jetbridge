<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1070" viewBox="0 0 860 1070" role="img" aria-labelledby="title desc">
  <title id="title">An example conversation with jetbridge in Claude Desktop</title>
  <desc id="desc">Someone asks Claude to watch a flight. Claude asks which New York airport, shows what it will watch, and saves it after a yes. They then say any North American airport and a day either side is fine, and Claude shows the wider scope before saving it.</desc>
  <defs>
    <g id="star" stroke="#d97757" stroke-width="2.3" stroke-linecap="round">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-5.7" y1="-5.7" x2="5.7" y2="5.7"/>
      <line x1="-5.7" y1="5.7" x2="5.7" y2="-5.7"/>
    </g>
  </defs>
  <style>
    .serif { font-family: ui-serif, "Tiempos Text", "Iowan Old Style", Georgia, "Times New Roman", serif; font-size: 16px; fill: #e9e6dc; }
    .ui { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #faf9f5; }
    .muted { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8a877d; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #e9e6dc; }
    .label { fill: #8a877d; }
    .chip { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #a8a599; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="1069" rx="14" fill="#262624" stroke="#3a3935"/>
  <text x="430" y="28" class="muted" text-anchor="middle">Watch a flight</text>
  <line x1="0" y1="44" x2="860" y2="44" stroke="#3a3935"/>

  <!-- you -->
  <rect x="238" y="68" width="596" height="60" rx="14" fill="#1b1a19"/>
  <text x="258" y="93" class="ui">Watch CX845 from New York to Hong Kong on May 21 2027,</text>
  <text x="258" y="115" class="ui">business, with American miles. It's just me flying.</text>

  <!-- claude -->
  <use href="#star" x="40" y="168"/>
  <text x="64" y="173" class="serif">New York has three airports. Which one does this flight use:</text>
  <text x="64" y="196" class="serif">JFK, EWR or LGA?</text>

  <rect x="690" y="222" width="144" height="42" rx="14" fill="#1b1a19"/>
  <text x="710" y="248" class="ui">JFK, alert me</text>

  <use href="#star" x="40" y="302"/>
  <rect x="64" y="288" width="226" height="28" rx="8" fill="none" stroke="#45443f"/>
  <circle cx="80" cy="302" r="3" fill="#8a877d"/>
  <text x="92" y="306" class="chip">jetbridge · review_watch</text>
  <text x="64" y="346" class="serif">Here's what I'll watch. Nothing is saved yet:</text>

  <rect x="64" y="362" width="660" height="204" rx="10" fill="#1b1a19" stroke="#3a3935"/>
  <text x="84" y="390" class="mono" xml:space="preserve"><tspan class="label">Flight         </tspan>CX845 from JFK to HKG</text>
  <text x="84" y="413" class="mono" xml:space="preserve"><tspan class="label">Cabin          </tspan>business</text>
  <text x="84" y="436" class="mono" xml:space="preserve"><tspan class="label">Miles          </tspan>American AAdvantage</text>
  <text x="84" y="459" class="mono" xml:space="preserve"><tspan class="label">Passengers     </tspan>1</text>
  <text x="84" y="482" class="mono" xml:space="preserve"><tspan class="label">Dates          </tspan>Fri, May 21, 2027</text>
  <text x="84" y="505" class="mono" xml:space="preserve"><tspan class="label">Price limit    </tspan>no limit</text>
  <text x="84" y="528" class="mono" xml:space="preserve"><tspan class="label">Alerts go to   </tspan>you@example.com</text>
  <text x="84" y="551" class="mono" xml:space="preserve"><tspan class="label">Searching      </tspan>about 5 aa.com searches a day, up to 9 close in</text>

  <text x="64" y="600" class="serif">Shall I save it?</text>

  <rect x="772" y="620" width="62" height="42" rx="14" fill="#1b1a19"/>
  <text x="791" y="646" class="ui">Yes</text>

  <use href="#star" x="40" y="692"/>
  <rect x="64" y="678" width="244" height="28" rx="8" fill="none" stroke="#45443f"/>
  <circle cx="80" cy="692" r="3" fill="#8a877d"/>
  <text x="92" y="696" class="chip">jetbridge · confirm_watch</text>
  <text x="64" y="736" class="serif">Saved, and I've run the first check: aa.com lists this flight,</text>
  <text x="64" y="759" class="serif">no business seats yet. You'll get an email the moment seats</text>
  <text x="64" y="782" class="serif">open, after a live re-check.</text>

  <rect x="372" y="814" width="462" height="60" rx="14" fill="#1b1a19"/>
  <text x="392" y="839" class="ui">Any North American airport is fine too, and a day</text>
  <text x="392" y="861" class="ui">either side. Tell me if anything beats my rules.</text>

  <use href="#star" x="40" y="906"/>
  <rect x="64" y="892" width="290" height="28" rx="8" fill="none" stroke="#45443f"/>
  <circle cx="80" cy="906" r="3" fill="#8a877d"/>
  <text x="92" y="910" class="chip">jetbridge · review_flexible_scope</text>
  <text x="64" y="950" class="serif">Got it. I'd also look one day either side and at other North</text>
  <text x="64" y="973" class="serif">American airports: nonstops only, same cabin and price rules,</text>
  <text x="64" y="996" class="serif">using only leftover searches. Save it?</text>

  <rect x="28" y="1014" width="804" height="34" rx="12" fill="#30302e" stroke="#4a4944"/>
  <text x="48" y="1036" class="muted" fill="#8a877d">Reply to Claude...</text>
  <rect x="796" y="1019" width="26" height="24" rx="8" fill="#d97757"/>
  <path d="M809 1036 V1026 M804.5 1030.5 L809 1026 L813.5 1030.5" fill="none" stroke="#1b1a19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="1062" class="muted" text-anchor="middle" font-size="11.5">An illustration of a typical conversation. Claude's wording varies.</text>
</svg>
