<svg xmlns="http://www.w3.org/2000/svg" width="860" height="800" viewBox="0 0 860 800" role="img" aria-labelledby="title desc">
  <title id="title">An example conversation with jetbridge in Claude Desktop</title>
  <desc id="desc">Someone asks Claude to watch a flight. Claude asks which New York airport, shows what it will watch, and saves it after a yes. They then say any North American airport and a day either side is fine, and Claude shows the wider scope before saving it.</desc>
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ff0c0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #e8edf7; }
    .small { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b97ad; }
    .title { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #aab5cb; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; fill: #e8edf7; }
    .label { fill: #6f7c94; }
    .you { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #07101f; }
  </style>
  <rect width="860" height="800" rx="16" fill="#090d15"/>
  <path d="M16 0H844A16 16 0 0 1 860 16V46H0V16A16 16 0 0 1 16 0Z" fill="#101626"/>
  <circle cx="26" cy="23" r="5.5" fill="url(#bubble)"/>
  <text x="42" y="28" class="title">Claude Desktop, with jetbridge connected</text>

  <rect x="238" y="68" width="596" height="58" rx="14" fill="url(#bubble)"/>
  <text x="258" y="92" class="you">Watch CX845 from New York to Hong Kong on May 21 2027,</text>
  <text x="258" y="113" class="you">business, with American miles. It's just me flying.</text>

  <text x="28" y="160" class="sans">New York has three airports. Which one does this flight use: JFK, EWR or LGA?</text>

  <rect x="690" y="178" width="144" height="42" rx="14" fill="url(#bubble)"/>
  <text x="710" y="204" class="you">JFK, alert me</text>

  <text x="28" y="252" class="sans">Here's what I'll watch. Nothing is saved yet:</text>

  <rect x="28" y="268" width="640" height="204" rx="12" fill="#0c1220" stroke="#232c3f"/>
  <text x="48" y="296" class="mono" xml:space="preserve"><tspan class="label">Flight:       </tspan>CX845 from JFK to HKG</text>
  <text x="48" y="319" class="mono" xml:space="preserve"><tspan class="label">Cabin:        </tspan>business</text>
  <text x="48" y="342" class="mono" xml:space="preserve"><tspan class="label">Miles:        </tspan>American AAdvantage</text>
  <text x="48" y="365" class="mono" xml:space="preserve"><tspan class="label">Passengers:   </tspan>1</text>
  <text x="48" y="388" class="mono" xml:space="preserve"><tspan class="label">Dates:        </tspan>Fri, May 21, 2027</text>
  <text x="48" y="411" class="mono" xml:space="preserve"><tspan class="label">Price limit:  </tspan>no limit</text>
  <text x="48" y="434" class="mono" xml:space="preserve"><tspan class="label">Alerts go to: </tspan>you@example.com</text>
  <text x="48" y="457" class="mono" xml:space="preserve"><tspan class="label">Searching:    </tspan>about 5 aa.com searches a day, up to 9 close to departure</text>

  <text x="28" y="502" class="sans">Shall I save it?</text>
  <rect x="772" y="518" width="62" height="42" rx="14" fill="url(#bubble)"/>
  <text x="791" y="544" class="you">Yes</text>

  <text x="28" y="594" class="sans">Saved, and I've run the first check: aa.com lists this flight, no business seats yet.</text>
  <text x="28" y="616" class="sans">You'll get an email the moment seats open, after a live re-check.</text>

  <rect x="372" y="640" width="462" height="58" rx="14" fill="url(#bubble)"/>
  <text x="392" y="664" class="you">Any North American airport is fine too, and a day</text>
  <text x="392" y="685" class="you">either side. Tell me if anything beats my rules.</text>

  <text x="28" y="728" class="sans">Got it: 30 nearby places, any nonstop in business under your rules. Save?</text>

  <line x1="28" y1="752" x2="832" y2="752" stroke="#232c3f"/>
  <text x="28" y="778" class="small">An illustration of a typical conversation. Claude's wording varies.</text>
</svg>
