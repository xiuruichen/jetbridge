[project]
name = "jetbridge"
version = "0.2.0"
description = "Watches award availability for a specific flight and emails you when seats open"
readme = "README.md"
authors = [{ name = "xiuruichen" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25",
    "mcp>=1.2",
    "patchright>=1.50",
    "typer>=0.12",
]

[project.scripts]
jetbridge = "jetbridge.cli:app"
jetbridge-mcp = "jetbridge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetbridge"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits aa.com (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"] # B008: typer options
