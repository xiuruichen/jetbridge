[project]
name = "jetbridge"
version = "0.4.0"
description = "Get an email when award seats open on the exact flight you want. Works with Claude Desktop."
readme = "README.md"
authors = [{ name = "xiuruichen" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["award travel", "award seats", "frequent flyer", "miles", "mcp", "claude"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "keyring>=25",
    "tzdata; sys_platform == 'win32'",
    "mcp>=2.3",
    "patchright>=1.50",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/xiuruichen/jetbridge"
Issues = "https://github.com/xiuruichen/jetbridge/issues"
Changelog = "https://github.com/xiuruichen/jetbridge/blob/main/CHANGELOG.md"

[project.scripts]
jetbridge = "jetbridge.cli:app"
jetbridge-mcp = "jetbridge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetbridge"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the airline sites (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"] # B008: typer options
