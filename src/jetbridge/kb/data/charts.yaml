# Award-chart sanity checks. Used ONLY to flag anomalies (possible parse errors
# or unusual dynamic pricing), never to invent prices.
last_verified: 2026-10-31
verified_by: "model knowledge (cutoff mid-2026); pending Phase 0 recon confirmation"

# Fixed partner chart: one-way miles per passenger from the contiguous US.
aa_partner:
  applies_to: partners   # not AA metal (dynamic)
  zones:
    ASIA_1: {airports_in_countries: [JP, KR, MN], Y: 35000, J: 60000, F: 80000}
    ASIA_2: {airports_in_countries: [HK, CN, TW, MO, PH, TH, VN, SG, MY, ID, KH, LA, MM, BN, IN, LK, BD, NP, MV], Y: 37500, J: 70000, F: 110000}
  confidence: verify

# Generic plausibility bands (one-way, per pax, US <-> Asia), applied to every program.
# An offer outside the band is flagged "price anomaly", not dropped.
plausibility:
  transpacific:
    Y: [15000, 200000]
    W: [25000, 300000]
    J: [45000, 600000]
    F: [60000, 900000]
  domestic:
    Y: [3000, 100000]
    W: [5000, 150000]
    J: [7500, 250000]
    F: [7500, 250000]
