# Regions, metros and gateways. Airport timezones/coords come from the
# `airportsdata` package (open data); this file only adds groupings.
last_verified: 2026-10-31

metros:
  TYO: [HND, NRT]
  OSA: [KIX, ITM]
  SEL: [ICN, GMP]
  SHA: [PVG, SHA]
  BJS: [PEK, PKX]
  NYC: [JFK, EWR, LGA]
  CHI: [ORD, MDW]
  WAS: [IAD, DCA, BWI]

regions:
  # Long-haul-served Asian airports most relevant for US award travel.
  ASIA_EAST: [HKG, ICN, HND, NRT, KIX, NGO, FUK, CTS, TPE, PVG, PEK, PKX, CAN, SZX, MFM]
  ASIA_SOUTHEAST: [SIN, BKK, MNL, CEB, SGN, HAN, KUL, CGK, DPS, KTI]
  ASIA_SOUTH: [DEL, BOM, BLR, MAA]
  ASIA: [ASIA_EAST, ASIA_SOUTHEAST]

# North American transpacific gateways (where long-haul award space departs).
# Used for positioning composition: origin -> gateway (separate ticket) -> Asia.
gateways: [SEA, SFO, LAX, SJC, SAN, YVR, ORD, DFW, IAH, JFK, EWR, BOS, ATL, DTW, IAD, MSP, SLC, LAS, YYZ, HNL, PHX]

# Driving-distance alternates by home airport (user can opt in via nearby_origins).
nearby:
  CVG: [DAY, CMH, SDF, IND, LEX]

# Minimum connection times in minutes used by the composer when the airline
# engine did not build the connection itself. Conservative defaults.
mct:
  default_domestic: 45
  default_international: 90
  separate_ticket_buffer: 180   # positioning flight on a separate ticket
  airport_change_buffer: 240    # e.g. NRT<->HND, EWR<->JFK
